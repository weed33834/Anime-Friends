<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--pink:#e879f9;--purple:#a855f7;--bg:#0b0a12;--card:#15131f;--card2:#1d1b2e;--text:#f8f7fc;--dim:#9ca3af;--border:rgba(232,121,249,0.25);--radius:16px;--accent:#e879f9}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
#particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.nav-bar{position:fixed;top:0;left:0;width:100%;background:rgba(11,10,18,0.95);backdrop-filter:blur(12px);z-index:50;border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;max-width:800px;margin:0 auto}
.nav-logo{font-family:'ZCOOL KuaiLe',cursive;font-size:18px;cursor:pointer;background:linear-gradient(135deg,var(--pink),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.nav-links{display:flex;gap:4px}
.nav-link{padding:6px 12px;border-radius:8px;font-size:13px;color:var(--dim);cursor:pointer;transition:all .2s;border:none;background:transparent;font-family:inherit}
.nav-link:hover{color:var(--text);background:rgba(232,121,249,0.1)}
.nav-link.active{color:var(--pink);background:rgba(232,121,249,0.15)}
.page{display:none;position:relative;z-index:1;min-height:100vh;padding:76px 20px 40px;max-width:800px;margin:0 auto}
.page.active{display:block;animation:fadeIn .5s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
.btn{padding:14px 32px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;transition:all .3s;display:inline-flex;align-items:center;gap:8px;font-family:inherit}
.btn-primary{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;box-shadow:0 4px 20px rgba(168,85,247,0.4)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(168,85,247,0.5)}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{background:rgba(232,121,249,0.1)}
.btn-sm{padding:8px 16px;font-size:13px;border-radius:8px}
.home-hero{text-align:center;padding:40px 0}
.home-badge{display:inline-block;padding:6px 16px;border-radius:20px;background:rgba(232,121,249,0.1);border:1px solid var(--border);font-size:13px;color:var(--pink);margin-bottom:24px}
.home-title{font-family:'ZCOOL KuaiLe',cursive;font-size:42px;line-height:1.3;margin-bottom:16px}
.home-title .grad{background:linear-gradient(135deg,var(--pink),var(--purple),var(--pink));background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 3s linear infinite}
.home-desc{color:var(--dim);font-size:15px;line-height:1.8;margin-bottom:32px;max-width:500px;margin-left:auto;margin-right:auto}
.home-buttons{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.home-stats{display:flex;gap:24px;justify-content:center;margin-top:40px;flex-wrap:wrap}
.home-stat{text-align:center}
.home-stat-num{font-size:32px;font-weight:900;background:linear-gradient(135deg,var(--pink),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.home-stat-label{font-size:12px;color:var(--dim);margin-top:4px}
.section-title{font-size:20px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.quiz-header{margin-bottom:24px}
.quiz-progress-text{text-align:center;font-size:14px;color:var(--dim);margin-bottom:8px}
.quiz-progress-bar{width:100%;height:6px;background:var(--card);border-radius:3px;overflow:hidden}
.quiz-progress-fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--purple));border-radius:3px;transition:width .3s}
.quiz-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:32px 24px;margin-bottom:24px;animation:slideIn .3s ease}
.quiz-emoji{font-size:36px;text-align:center;margin-bottom:12px}
.quiz-question{font-size:20px;font-weight:700;margin-bottom:24px;line-height:1.5;text-align:center}
.quiz-options{display:flex;flex-direction:column;gap:12px}
.quiz-option{padding:16px;border:1px solid var(--border);border-radius:12px;background:var(--card2);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:12px;font-size:15px;color:var(--text);font-family:inherit;text-align:left}
.quiz-option:hover{border-color:var(--pink);background:rgba(232,121,249,0.05)}
.quiz-option.selected{border-color:var(--pink);background:rgba(232,121,249,0.15);box-shadow:0 0 0 1px var(--pink)}
.quiz-option-letter{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;transition:all .2s}
.quiz-option.selected .quiz-option-letter{border-color:var(--pink);background:var(--pink);color:#fff}
.quiz-nav{display:flex;justify-content:space-between;gap:12px}
.mini-radar-wrap{position:fixed;bottom:20px;right:20px;z-index:40;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px;display:none}
.mini-radar-wrap.show{display:block}
.mini-radar-label{font-size:10px;color:var(--dim);text-align:center;margin-top:4px}
.result-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:24px}
.result-image-wrap{width:100%;background:var(--card2);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.result-image-wrap img{max-width:100%;max-height:500px;object-fit:contain;display:block}
.result-info{padding:24px}
.result-series{font-size:13px;color:var(--accent);margin-bottom:4px}
.result-name{font-size:28px;font-weight:700;margin-bottom:8px}
.result-match{font-size:36px;font-weight:900;background:linear-gradient(135deg,var(--pink),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.result-tags{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.result-tag{padding:4px 12px;border-radius:20px;background:rgba(232,121,249,0.1);font-size:12px;color:var(--accent)}
.result-desc{color:var(--dim);font-size:14px;line-height:1.8;margin:16px 0}
.result-quote{font-style:italic;color:var(--accent);font-size:15px;padding:12px 16px;border-left:3px solid var(--accent);background:rgba(232,121,249,0.05);border-radius:0 8px 8px 0;margin:16px 0}
.result-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.result-meta-item{text-align:center;background:var(--card2);border-radius:8px;padding:12px}
.result-meta-label{font-size:11px;color:var(--dim);margin-bottom:4px}
.result-meta-val{font-size:14px;font-weight:600}
.result-analysis{background:var(--card2);border-radius:12px;padding:20px;margin:16px 0;border-left:3px solid var(--accent)}
.result-analysis h3{font-size:16px;margin-bottom:12px;color:var(--accent)}
.result-analysis p{font-size:14px;line-height:1.8;color:var(--text)}
.result-favor-quote{background:linear-gradient(135deg,rgba(232,121,249,0.08),rgba(168,85,247,0.08));border-radius:12px;padding:20px;margin:16px 0;border:1px solid var(--border);text-align:center}
.result-favor-quote .heart{font-size:24px;margin-bottom:8px}
.result-favor-quote p{font-size:15px;line-height:1.8;color:var(--text);font-style:italic}
.result-favor-quote .attr{font-size:12px;color:var(--dim);margin-top:8px}
.radar-chart-wrap{display:flex;justify-content:center;margin:24px 0}
.result-recommendations{margin-top:24px}
.result-recommendations h3{font-size:18px;margin-bottom:16px}
.rec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.rec-card{background:var(--card2);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:all .2s}
.rec-card:hover{border-color:var(--pink);transform:translateY(-2px)}
.rec-image-wrap{width:100%;aspect-ratio:3/4;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center}
.rec-image-wrap img{max-width:100%;max-height:100%;object-fit:contain}
.rec-info{padding:8px}
.rec-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-match{font-size:12px;color:var(--accent)}
.share-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin:24px 0;text-align:center}
.share-section h3{font-size:16px;margin-bottom:12px;color:var(--accent)}
.share-text{background:var(--card2);border-radius:8px;padding:12px;font-size:13px;line-height:1.6;color:var(--text);text-align:left;margin:12px 0;white-space:pre-wrap}
.gallery-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.gallery-title{font-size:24px;font-weight:700}
.search-bar{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);font-size:14px;font-family:inherit;margin-bottom:16px}
.search-bar:focus{outline:none;border-color:var(--pink)}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.gallery-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .2s}
.gallery-card:hover{border-color:var(--pink);transform:translateY(-4px);box-shadow:0 8px 30px rgba(168,85,247,0.2)}
.gallery-image-wrap{width:100%;background:var(--card2);overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:200px}
.gallery-image-wrap img{max-width:100%;max-height:300px;object-fit:contain;display:block}
.gallery-info{padding:12px}
.gallery-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gallery-series{font-size:12px;color:var(--dim);margin-top:2px}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.filter-chip{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--dim);font-size:13px;cursor:pointer;transition:all .2s;font-family:inherit}
.filter-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.filter-chip:hover{border-color:var(--pink)}
.compare-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:24px}
.compare-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:start}
.compare-slot{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:16px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
.compare-slot:hover{border-color:var(--pink)}
.compare-slot.has-char{justify-content:flex-start}
.compare-vs{text-align:center;font-size:24px;font-weight:900;color:var(--accent);padding-top:80px}
.compare-image-wrap{width:100%;max-height:200px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.compare-image-wrap img{max-width:100%;max-height:200px;object-fit:contain}
.compare-empty{color:var(--dim);font-size:14px;text-align:center}
.ranking-list{display:flex;flex-direction:column;gap:12px}
.rank-item{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;transition:all .2s}
.rank-item:hover{border-color:var(--pink);transform:translateX(4px)}
.rank-num{font-size:24px;font-weight:900;width:40px;text-align:center;flex-shrink:0}
.rank-num.top1{background:linear-gradient(135deg,#ffd700,#ffaa00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.rank-num.top2{background:linear-gradient(135deg,#c0c0c0,#a0a0a0);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.rank-num.top3{background:linear-gradient(135deg,#cd7f32,#a0522d);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.rank-image{width:60px;height:60px;border-radius:8px;overflow:hidden;flex-shrink:0;background:var(--card2);display:flex;align-items:center;justify-content:center}
.rank-image img{max-width:100%;max-height:100%;object-fit:contain}
.rank-info{flex:1;min-width:0}
.rank-name{font-size:15px;font-weight:600}
.rank-series{font-size:12px;color:var(--dim)}
.rank-traits{font-size:11px;color:var(--accent);margin-top:2px}
.rank-score{font-size:18px;font-weight:700;color:var(--accent)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.stat-card .num{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--pink),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-card .label{font-size:12px;color:var(--dim);margin-top:4px}
.bar-chart{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:24px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar-label{width:60px;font-size:13px;text-align:right;flex-shrink:0}
.bar-track{flex:1;height:24px;background:var(--card2);border-radius:4px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:4px;transition:width .5s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:8px}
.bar-val{font-size:12px;font-weight:700;color:#fff}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.active{display:flex}
.modal-content{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);max-width:500px;max-height:90vh;overflow-y:auto;width:100%;position:relative}
.modal-image-wrap{width:100%;background:var(--card2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.modal-image-wrap img{max-width:100%;max-height:400px;object-fit:contain}
.modal-body{padding:24px}
.modal-close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,0.5);border:none;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:1}
.img-placeholder{display:flex;align-items:center;justify-content:center;background:var(--card2);color:var(--dim);font-size:14px;min-height:200px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--accent);border-radius:8px;padding:12px 24px;font-size:14px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:600px){.home-title{font-size:28px}.home-desc{font-size:14px}.home-badge{font-size:12px}.quiz-card{padding:20px 16px}.quiz-question{font-size:17px}.quiz-option{padding:14px;font-size:14px}.quiz-option-letter{width:28px;height:28px;font-size:13px}.gallery-grid{grid-template-columns:repeat(2,1fr);gap:12px}.gallery-image-wrap{min-height:160px}.rec-grid{grid-template-columns:repeat(2,1fr)}.result-image-wrap img{max-height:350px}.result-name{font-size:22px}.result-match{font-size:28px}.compare-grid{grid-template-columns:1fr}.compare-vs{display:none}.result-meta{grid-template-columns:1fr}.home-stats{gap:12px}.home-stat-num{font-size:26px}.mini-radar-wrap{display:none!important}.nav-bar{padding:0 12px;height:50px}.nav-logo{font-size:15px}.nav-links{gap:0}.nav-link{padding:5px 6px;font-size:11px}.page{padding:60px 12px 30px}.btn{padding:12px 24px;font-size:14px}.result-analysis{padding:16px}.result-analysis h3{font-size:15px}.result-analysis p{font-size:13px;line-height:1.7}.result-favor-quote{padding:16px}.result-favor-quote p{font-size:14px}.modal-content{max-width:95vw}.modal-image-wrap img{max-height:300px}.modal-body{padding:16px}.rank-item{padding:10px;gap:10px}.rank-image{width:50px;height:50px}.rank-name{font-size:14px}.bar-label{width:50px;font-size:12px}.stats-grid{grid-template-columns:repeat(2,1fr)}.search-bar{font-size:13px}.filter-chip{padding:5px 10px;font-size:12px}.radar-chart-wrap canvas{max-width:100%;height:auto!important}}
@media(max-width:380px){.home-title{font-size:24px}.gallery-grid{grid-template-columns:1fr}.nav-link{padding:4px 5px;font-size:10px}.home-stat-num{font-size:22px}}
</style>
</head>

<canvas id="particles"></canvas>
<nav class="nav-bar"><div class="nav-logo" onclick="goHome()">Anime Friends</div><div class="nav-links"><button class="nav-link" data-page="home" onclick="goHome()">首页</button><button class="nav-link" data-page="quiz" onclick="goQuiz()">测试</button><button class="nav-link" data-page="gallery" onclick="goGallery()">图鉴</button><button class="nav-link" data-page="ranking" onclick="goRanking()">排行</button><button class="nav-link" data-page="compare" onclick="goCompare()">对比</button><button class="nav-link" data-page="stats" onclick="goStats()">统计</button></div></nav>

", "appearance": "紫色长发，常抱着一只野猪玩偶，穿校服", "traits": [70, 80, 75, 75, 85, 70, 60, 65, 30, 80, 75, 70], "image": "images/kyou.jpg", "quote": "真是的，你这个人怎么这么让人操心！", "cv": "广桥凉", "birthday": "9月9日", "catchphrase": "哈？你说什么！", "color": "#4169e1", "favor_quote": "哼，别以为我是因为担心你才一直盯着你……才怪啦！就是担心你怎么样嘛！"}, {"id": "tomoyo", "name": "坂上智代", "series": "Clannad", "tags": "帅气,打架,完美", "description": "坂上智代是光坂高校学生会长，以强悍的战斗力著称，被称为'暴力女'却拥有不输给任何人的温柔。她为了守护学校里的樱花树而入学，这份对美好事物的执着贯穿了她的人生。她做事果断利落，说话直截了当，但在面对感情时却会流露出少女特有的羞涩。她的强大不是冷漠，而是为了保护珍视之人而磨砺出的力量。", "appearance": "银色短发，蓝色眼眸，穿水手服校服", "traits": [75, 85, 90, 55, 85, 35, 80, 80, 40, 85, 60, 65], "image": "images/tomoyo.jpg", "quote": "如果你愿意的话，我可以用我的方式守护你。", "cv": "桑岛法子", "birthday": "10月14日", "catchphrase": "（整理头发）", "color": "#00bfff", "favor_quote": "我会变得更强，强到足以守护你的一切。所以——请站在我身后就好。"}, {"id": "kotomi", "name": "一之濑琴美", "series": "Clannad", "tags": "天才,提琴,书虫", "description": "一之濑琴美是全校成绩第一的天才少女，却有着令人心疼的孤独过去。她总是独自坐在图书室里读书，用剪刀剪报纸是她独特的习惯——那是与已故父母之间最后的联系。她看似不谙世事，实则对人性有着敏锐的洞察。当她用小提琴演奏时，那堪比生化武器的音准背后，是一颗渴望被理解的心。她的天真不是无知，而是在失去一切后依然选择相信温暖。", "appearance": "紫色长发，戴大蝴蝶结发饰，穿校服", "traits": [80, 40, 85, 50, 75, 50, 75, 70, 65, 35, 70, 35], "image": "images/kotomi.jpg", "quote": "嘘……让我再读一会儿书好吗？", "cv": "能登麻美子", "birthday": "5月13日", "catchphrase": "（剪报纸）……", "color": "#9370db", "favor_quote": "你是我最重要的朋友。所以……我会为你读遍世界上所有的书，把我知道的一切都告诉你。"}, {"id": "fuko", "name": "伊吹风子", "series": "Clannad", "tags": "星形,雕刻,天然", "description": "伊吹风子是个永远在雕刻海星的奇妙少女，她的存在本身就是一场温暖的奇迹。她为了姐姐的婚礼而雕刻海星分发给他人，这份纯粹的心意能跨越时空感动每一个人。她性格天真烂漫，对海星有着近乎执念的热爱，遇到喜欢的事物会两眼放光。虽然常常被人遗忘，但她从不放弃传递幸福。她的可爱是那种让人忍不住微笑、想要好好守护的类型。", "appearance": "棕色短发，抱着海星玩偶，穿校服", "traits": [75, 65, 50, 85, 80, 40, 55, 45, 55, 60, 80, 60], "image": "images/fuko.jpg", "quote": "这是……星形的海星！你感受到了吗，海星的力量！", "cv": "野中蓝", "birthday": "7月20日", "catchphrase": "噗哈~！（举海星）", "color": "#00ced1", "favor_quote": "这个海星送给你！它是我的宝贝，但现在你是我更重要的宝贝……嘿嘿，收下嘛！"}, {"id": "kotomi2", "name": "古河早苗", "series": "Clannad", "tags": "姐姐,温柔,早苗", "description": "古河早苗是渚的母亲，看似柔弱的家庭主妇实则有着不可思议的力量。她做的面包虽然外观奇怪，却充满了母亲的爱意。她总是笑容满面地迎接每一个回家的人，那句'欢迎回来'是世界上最温暖的语言。她的哭泣如同暴风骤雨，但笑容却比阳光还灿烂。她和丈夫秋生之间的互动是教科书式的夫妻相处——吵吵闹闹却深爱彼此。", "appearance": "蓝色短发，穿围裙，温柔的笑容", "traits": [95, 70, 65, 60, 95, 20, 65, 85, 25, 70, 90, 75], "image": "images/kotomi2.jpg", "quote": "今天也做了好吃的面包哦~大家快来吃！", "cv": "井上喜久子", "birthday": "4月14日", "catchphrase": "啊啦啊啦~", "color": "#ffb347", "favor_quote": "你回来啦！今天做了你最喜欢的料理哦。来，多吃点，看你都瘦了~啊啦，别害羞嘛！"}, {"id": "rei", "name": "绫波丽", "series": "新世纪福音战士", "tags": "三无,蓝发,战斗服", "description": "绫波丽是EVA零号机的驾驶员，一个被称为'冰山少女'的存在。她沉默寡言，面无表情，仿佛没有感情的人偶。然而在她那双红瞳深处，隐藏着对存在意义的迷茫和对温暖的渴望。她会默默用创可贴包扎伤口，会在战斗中毫不犹豫地牺牲自己。她的冷漠不是无情，而是从未被教会如何表达情感。当她第一次说出'谢谢'时，整个世界都为之动容。", "appearance": "蓝色短发，红色眼瞳，穿白色战斗服", "traits": [55, 40, 90, 20, 70, 15, 75, 60, 95, 30, 40, 25], "image": "images/rei.jpg", "quote": "我并不是因为你或者任何人而在这里的。", "cv": "林原惠美", "birthday": "3月30日", "catchphrase": "……（沉默地注视）", "color": "#4169e1", "favor_quote": "在你身边的时候，我感觉到一种……温暖。这种感觉，以前从未有过。所以……请别离开。"}, {"id": "asuka", "name": "明日香·兰格雷", "series": "新世纪福音战士", "tags": "傲娇,天才,红色", "description": "明日香·兰格雷是EVA二号机的驾驶员，天才少女的骄傲背后是支离破碎的内心。她用傲慢和攻击性来掩饰自己对被抛弃的恐惧，用成绩和战斗能力来证明自己的价值。她讨厌被同情，更讨厌被忽视，渴望被认可却又害怕亲密。当她卸下那层带刺的铠甲时，只是一个渴望母亲爱抚的孤独女孩。她的傲娇不是表演，而是求生本能。", "appearance": "橙红色长发，蓝色眼眸，穿红色战斗服", "traits": [50, 90, 80, 60, 60, 95, 65, 70, 40, 90, 75, 65], "image": "images/asuka.jpg", "quote": "你在看哪里啊，笨蛋！", "cv": "宫村优子", "birthday": "12月4日", "catchphrase": "啊——你这家伙真是的！", "color": "#ff4500", "favor_quote": "哼，别搞错了！我才不是……在意你呢！只是，你不在我会觉得很烦躁而已！"}, {"id": "misato", "name": "葛城美里", "series": "新世纪福音战士", "tags": "成熟,啤酒,战术", "description": "葛城美里是NERV战术作战部长，白天是干练的军事指挥官，晚上是啤酒不离手的邋遢大姐姐。她用欢脱的外表包裹着第二次冲击带来的心理创伤，在对使徒的战斗中展现出冷静果断的指挥能力。她对真嗣等人既是上司又是家人，那种笨拙却真挚的关怀让人动容。她身上有着成年人的复杂——坚强与脆弱、责任与逃避、爱与距离，全部交织在一起。", "appearance": "紫色短发，穿黑色夹克和红色裙，佩戴十字架项链", "traits": [70, 75, 85, 55, 80, 45, 70, 90, 55, 80, 70, 75], "image": "images/misato.png", "quote": "服务，服务~（举啤酒罐）", "cv": "三石琴乃", "birthday": "12月8日", "catchphrase": "（咕嘟咕嘟喝啤酒）哈——！", "color": "#9370db", "favor_quote": "辛苦了~！来，一起喝一杯放松放松吧。不用担心什么，有我在呢，什么都会好起来的。"}, {"id": "rem", "name": "雷姆", "series": "Re:从零开始的异世界生活", "tags": "女仆,蓝发,忠诚", "description": "雷姆是罗兹瓦尔宅邸的女仆，蓝发鬼族少女。她曾因魔女残渣的气味对昴充满杀意，但在被他的善意和坚持打动后，奉献了全部的忠诚与爱。她的感情炽烈而纯粹——为了昴可以牺牲一切，包括自己的生命和尊严。她表面恭敬有礼，实际上有着惊人的战斗力。她的爱不是盲目，而是在看清了对方的软弱后依然选择守护的决心。'从那以后，雷姆的灵魂就是昴一个人的了。'", "appearance": "蓝色短发，女仆装，隐藏的鬼角", "traits": [90, 70, 65, 45, 100, 55, 70, 75, 50, 75, 90, 55], "image": "images/rem.jpg", "quote": "从那以后，雷姆的灵魂……就是昴一个人的了。", "cv": "水濑祈", "birthday": "2月2日", "catchphrase": "昴……（微微低头微笑）", "color": "#4169e1", "favor_quote": "无论你做了什么选择，雷姆都会站在你这边。因为雷姆的全世界，就是你啊。"}, {"id": "ram", "name": "拉姆", "series": "Re:从零开始的异世界生活", "tags": "女仆,粉发,毒舌", "description": "拉姆是雷姆的双胞胎姐姐，粉发鬼族少女。因幼年失去角而实力大减，但她从不以此为耻，反而以'虽然失去了角但姐姐还是姐姐'的自信面对一切。她毒舌刻薄，尤其喜欢捉弄昴，但每一句嘲讽背后都藏着对妹妹和同伴的深沉关爱。她对罗兹瓦尔的忠诚近乎信仰，即使知道他的真面目也不动摇。她的骄傲是盔甲，里面装着比谁都重感情的心。", "appearance": "粉色短发，女仆装，眼神锐利", "traits": [65, 60, 80, 50, 95, 80, 75, 78, 55, 60, 65, 50], "image": "images/ram.jpg", "quote": "哼，这种程度的事情，姐姐我当然能做到。", "cv": "村川梨衣", "birthday": "2月2日", "catchphrase": "哼……（翻白眼）", "color": "#ff1493", "favor_quote": "别误会，我可不是因为在乎你才帮你的。只是……如果连这点小事都做不到，岂不是丢了姐姐的面子？"}, {"id": "emilia", "name": "爱蜜莉雅", "series": "Re:从零开始的异世界生活", "tags": "银发,精灵,王选", "description": "爱蜜莉雅是银发半妖精少女，因与嫉妒魔女外貌相似而遭受世人的偏见和恐惧。她温柔善良，即便被世界否定也选择相信人性的美好。她有着不谙世事的天然一面，会被简单的玩笑逗得脸红，也会因不了解常识而闹出笑话。在王选之路上她不断成长，从需要被保护的少女逐渐变成能独当一面的领导者。她的美不仅是外表，更是那份在苦难中依然选择温柔的灵魂。", "appearance": "银色长发，紫色眼瞳，穿白色长裙", "traits": [90, 60, 70, 45, 85, 40, 90, 72, 75, 55, 85, 60], "image": "images/emilia.jpg", "quote": "我虽然是半妖精，但我的心和大家是一样的。", "cv": "高桥李依", "birthday": "9月23日", "catchphrase": "真是个……奇怪的人呢。", "color": "#c0c0c0", "favor_quote": "谢谢你又一次救了我。每次看到你拼命的样子，我就觉得……必须更加努力才行呢。"}, {"id": "beatrice", "name": "碧翠丝", "series": "Re:从零开始的异世界生活", "tags": "萝莉,金发,图书馆", "description": "碧翠丝是禁书库的管理者，金发双马尾的矮小少女。她用尖酸刻薄的态度与人保持距离，实际上是因为承担着守护禁书库的四百年孤独。她渴望结束永恒的等待，却又害怕被遗弃。她的傲娇是经过四百年打磨的防御机制——推开所有人，又暗自期待有人能打破她的壳。当她终于说出'我想被你杀死'时，那不是绝望，而是一个孤独灵魂对被爱的最后渴望。", "appearance": "金色双马尾，金色眼眸，穿红白洋装", "traits": [60, 45, 85, 55, 80, 85, 80, 70, 85, 50, 70, 35], "image": "images/beatrice.jpg", "quote": "够了，别碰我。除非……你真的想被吃掉。", "cv": "新井里美", "birthday": "8月8日", "catchphrase": "——嗯？何事？", "color": "#ffd700", "favor_quote": "哼，才不是在等你呢。只是……恰好在这里看书而已。你来了，那就坐吧。"}, {"id": "echidna", "name": "艾姬多娜", "series": "Re:从零开始的异世界生活", "tags": "魔女,好奇,茶会", "description": "艾姬多娜是'强欲'魔女，拥有无尽求知欲的银发少女。她对世间一切未知事物都抱有炽热的好奇心，尤其对昴的死亡回归能力着迷到近乎痴迷。她聪明绝顶，言辞优雅而危险，每一句话都暗含深意。她的茶会散发着致命的吸引力——明知她危险，却无法拒绝她的邀请。她的贪婪不是恶，而是一个永生者对知识最纯粹也最可怕的渴望。", "appearance": "白色长发，黑色长裙，绿色眼眸，手持茶杯", "traits": [55, 50, 90, 45, 60, 50, 90, 88, 95, 65, 50, 55], "image": "images/echidna.jpg", "quote": "我对一切未知都充满好奇——包括你的死亡。", "cv": "坂本真绫", "birthday": "11月14日", "catchphrase": "呵呵呵……真有趣呢。", "color": "#2f2f2f", "favor_quote": "你的每一次死亡都让我着迷。所以……请让我继续观察你吧。这是贪婪之女王的请求哦。"}, {"id": "rem_alt", "name": "雷姆（暴食形态）", "series": "Re:从零开始的异世界生活", "tags": "暴食,蓝发,暴走", "description": "雷姆（暴食形态）是雷姆被暴食大罪司教操控后的形态。蓝发变为深蓝，眼中失去了平日的温柔，取而代之的是对'食物'的无尽渴望。这个形态下的雷姆失去了记忆和自我，只剩下本能的食欲。然而在灵魂深处，她对昴的爱依然在挣扎——即便被操控，也不会伤害昴分毫。这个形态是雷姆最悲惨的一面，也是她对昴的感情最极端的证明。", "appearance": "蓝色短发，空洞的眼神，穿睡裙", "traits": [70, 30, 40, 20, 60, 10, 50, 45, 60, 20, 50, 30], "image": "images/rem_alt.jpg", "quote": "吃掉……吃掉……我要吃掉一切……", "cv": "水濑祈", "birthday": "2月2日", "catchphrase": "（低语）饥渴……", "color": "#191970", "favor_quote": "你也是……我要吃掉的东西吗？不……你身上有昴的味道……那就，暂时不吃掉你吧。"}, {"id": "kurisu", "name": "牧濑红莉栖", "series": "命运石之门", "tags": "天才,傲娇,红发", "description": "牧濑红莉栖是脑科学研究所的天才少女研究员，17岁就已在学术期刊发表论文。她毒舌傲娇，嘴上不饶人，实际上内心非常温柔。她对父亲有着复杂的感情——渴望被认可却又被背叛，这份伤痛塑造了她倔强又脆弱的性格。她喜欢@ch的论坛文化，却死不承认。在无数条时间线中，她的命运与凶真交织在一起，成为了跨越时空的爱情最动人的注脚。", "appearance": "红棕色长发，蓝灰色眼眸，穿白衬衫和黑色短裤", "traits": [70, 65, 90, 55, 80, 88, 80, 82, 65, 75, 70, 60], "image": "images/kurisu.jpg", "quote": "我才不是什么天才……只是比别人多努力了一点而已。", "cv": "今井麻美", "birthday": "7月25日", "catchphrase": "你……太天真了。（叉腰）", "color": "#8b0000", "favor_quote": "又见面了啊……你知道吗，在所有时间线里，只有和你在一起的那条线，让我觉得活着是有意义的。"}, {"id": "mayuri", "name": "椎名真由理", "series": "命运石之门", "tags": "天然,温柔,星星", "description": "椎名真由理是未来道具研究所的研究员No.002，冈部伦太郎的青梅竹马。她看起来天真无邪、什么都不懂，实际上对周围人的情感有着惊人的敏锐。她的'嘟嘟噜'是招牌问候，她的微笑能治愈一切伤痛。她喜欢扭蛋和毛绒玩具，有着独特的审美和时尚品味。她不是不懂悲伤，而是选择用微笑守护身边的人——即便这意味着要独自承受命运的残酷。", "appearance": "黑色长发，戴圆形帽子，穿蓝色连衣裙", "traits": [95, 75, 40, 80, 85, 15, 60, 50, 30, 50, 90, 70], "image": "images/mayuri.jpg", "quote": "真由理找到了~！嘟嘟噜~！", "cv": "花泽香菜", "birthday": "5月3日", "catchphrase": "嘟嘟噜~♪", "color": "#87ceeb", "favor_quote": "你回来啦~！真由理一直在等你哦。看，今天也给你准备了扭蛋的运气！嘟嘟噜~！"}, {"id": "kaori", "name": "宫园薰", "series": "四月是你的谎言", "tags": "小提琴,金发,坚强", "description": "宫园薰是天才小提琴少女，用自由奔放的演奏风格震撼了整个音乐界。她看似开朗活泼、无拘无束，实际上身患重病、时日无多。她接近公生并非偶然——那是她从小的暗恋，是她生命最后的愿望。她用音乐传递无法言说的感情，用笑容掩盖身体的痛苦。她的每一次演奏都像是在与命运抗争，每一个音符都饱含着对生命的热爱和对爱的渴望。", "appearance": "金发，蓝色眼眸，穿校服或白色连衣裙，持小提琴", "traits": [90, 85, 70, 75, 85, 40, 85, 75, 50, 90, 95, 75], "image": "images/kaori.jpg", "quote": "也许我会消失……但在那之前，请让我在你身边。", "cv": "种崎敦美", "birthday": "7月4日", "catchphrase": "（举小提琴）准备好了吗？", "color": "#ffd700", "favor_quote": "谢谢你让我重新拿起了小提琴。和你一起演奏的日子……是我人生中最闪耀的时光。"}, {"id": "taiga", "name": "逢坂大河", "series": "龙与虎", "tags": "掌中老虎,傲娇,双马尾", "description": "逢坂大河是手掌大的老虎——身材娇小却脾气火爆，被称为'掌中老虎'。她有着精致可爱的脸庞和令人畏惧的暴力值，一根木刀就能让全校男生闻风丧胆。她的傲娇是教科书级别的——嘴上说着'笨狗'，心里却依赖着对方的陪伴。她的家庭破碎让她对亲密关系充满恐惧，一旦认定便全力以赴。她的爱如同她的性格——热烈、笨拙、毫无保留。", "appearance": "棕色长发双马尾，身材娇小，穿校服", "traits": [65, 85, 60, 70, 85, 95, 55, 55, 30, 75, 80, 65], "image": "images/taiga.jpg", "quote": "你这条笨狗！谁允许你离开我身边的！", "cv": "钉宫理惠", "birthday": "7月27日", "catchphrase": "你这……笨——蛋！", "color": "#ff6347", "favor_quote": "哼！才不是想见你才等你的！只是……恰好站在这里而已！别自作多情了，笨狗！"}, {"id": "senjougahara", "name": "战场原黑仪", "series": "物语系列", "tags": "傲娇,文具,体重", "description": "战场原黑仪是直江津高中的优等生，因螃蟹怪异失去了重量。她用毒舌和冷面来伪装自己，被阿良良木历称为'暴君'和'虐待狂'。她的言辞如手术刀般精准致命，却总在关键时刻流露出令人心疼的脆弱。她的过去充满了被欺骗和伤害的经历，但她选择用知识武装自己而非逃避。当她找回重量时，也找回了面对真实的勇气。她的爱是少数人的特权——一旦获得，便是最深沉的忠诚。", "appearance": "紫色长发，穿校服，手持文具", "traits": [60, 60, 85, 50, 80, 95, 75, 78, 60, 70, 65, 55], "image": "images/senjougahara.jpg", "quote": "我什么都做不了。但是……你能。", "cv": "斋藤千和", "birthday": "7月7日", "catchphrase": "（面无表情地凝视 ！（举旗）", "color": "#00ced1", "favor_quote": "有你在的话，我就觉得什么都能做到。所以……不要擅自消失，这是命令！"}, {"id": "tohka", "name": "夜刀神十香", "series": "约会大作战", "tags": "精灵,剑,饭量", "description": "夜刀神十香是第一个出现的精灵，紫发紫瞳的少女。她被士道拯救后对人类世界充满好奇，尤其是对食物——面包是她的最爱。她性格直率单纯，但也因此容易受伤。作为精灵她拥有强大的战斗力，但日常生活中却笨拙得可爱。她的傲娇是后天学会的——因为她不想承认自己太依赖士道。她的爱是纯粹的、不含杂质的，像孩子一样直白。", "appearance": "紫色长发，紫色眼眸，穿紫色神灵装持大剑", "traits": [80, 90, 55, 75, 85, 50, 65, 55, 50, 75, 80, 70], "image": "images/tohka.jpg", "quote": "什、什么嘛！才不是因为你才开心的！……大概吧。", "cv": "井上麻里奈", "birthday": "4月10日", "catchphrase": "哈？你在说什么啊！", "color": "#9370db", "favor_quote": "和士道在一起的时候最开心了！啊、不是说你……不过，如果你也愿意的话……咳咳。"}, {"id": "kurumi", "name": "时崎狂三", "series": "约会大作战", "tags": "时间,时钟眼,哥特", "description": "时崎狂三是最危险的精灵之一，左眼是金色的时钟。她优雅、狡黠、危险，如同盛开的彼岸花——美丽而致命。她的目的并非毁灭世界，而是通过吸收时间来回到三十年前杀死最初的精灵。她的手段残忍却不无道理——背负着沉重的使命，她选择了最孤独的道路。她与士道的每次相遇都像猫捉老鼠的游戏，暗含着难以言说的情愫。她是'最恶的精灵'，也是最让人心疼的反英雄。", "appearance": "黑色长发双马尾，异色瞳（左金时钟右红），穿红黑哥特装", "traits": [55, 75, 85, 60, 50, 80, 85, 75, 95, 85, 65, 55], "image": "images/kurumi.jpg", "quote": "啊啦啊啦~今天是什么风把你吹来了？", "cv": "真田麻美", "birthday": "6月10日", "catchphrase": "啊啦~时机正好呢。", "color": "#8b0000", "favor_quote": "你真是个有趣的人……所以，我决定再多观察你一会儿。别担心——暂时不会吃掉你的。"}, {"id": "kotori", "name": "五河琴里", "series": "约会大作战", "tags": "发饰,司令,反差", "description": "五河琴里是士道的义妹，平时是扎双马尾的傲娇小学生，变换缎带后则变成冷静果断的拉塔托斯克司令官。她有两个截然不同的人格——白色缎带的她是黏着哥哥的可爱妹妹，黑色缎带的她是运筹帷幄的指挥官。这种双重性源于她同时是火之精灵的事实。她对士道的感情在'家人'和'异性'之间模糊不清，她的傲娇是最真实的那种——因为太在乎所以说不出口。", "appearance": "红色双马尾，红色眼眸，根据发带颜色切换性格", "traits": [65, 85, 80, 60, 85, 75, 65, 70, 55, 80, 65, 65], "image": "images/kotori.jpg", "quote": "哼！身为哥哥，你要更加可靠一点啊！", "cv": "竹达彩奈", "birthday": "8月4日", "catchphrase": "（吃棒棒糖）哼——！", "color": "#ff4500", "favor_quote": "才不是担心你！只是如果你出事了，谁来给我做饭啊！所以……给我好好活着，笨蛋老哥。"}, {"id": "miku", "name": "中野三玖", "series": "五等分的新娘", "tags": "三玖,耳机,战国", "description": "中野三玖是五胞胎中的三女，戴着耳机的内向少女。她最初成绩垫底，但在风太郎的辅导下逐渐展现出学习天赋。她喜欢战国武将和历史，说起历史话题时会变得异常健谈。她的安静不是冷漠而是害羞——她不知道如何表达自己的感情，总是把想说的话咽回去。她的爱是细水长流式的，从感激到依赖再到喜欢，每一步都走得小心翼翼。", "appearance": "蓝色短发，戴耳机，穿校服", "traits": [80, 45, 70, 50, 80, 55, 75, 60, 55, 45, 75, 40], "image": "images/miku.jpg", "quote": "虽然我不擅长表达……但这份心情，是真的。", "cv": "伊藤美来", "birthday": "5月5日", "catchphrase": "（低头）……不，没什么。", "color": "#4169e1", "favor_quote": "和你在一起的时候，连历史都变得有趣了。所以……以后也教我更多东西，好吗？"}, {"id": "nino", "name": "中野二乃", "series": "五等分的新娘", "tags": "二乃,时尚,强势", "description": "中野二乃是五胞胎中的次女，时尚杂志的模特。她性格强势高傲，最初对风太郎充满敌意。她用冷漠和毒舌来保护自己和姐妹们，实际上内心非常重视家庭。她的成长是最戏剧性的——从下药赶走到主动告白，她的转变源于风太郎对她姐妹们的真诚付出。她的爱一旦给出便全力以赴、不计后果。她是那种'说了喜欢你就是真的喜欢你'的类型，绝不虚伪。", "appearance": "黑色长发，戴蝴蝶结发饰，穿时尚服装", "traits": [65, 85, 75, 70, 75, 85, 75, 65, 40, 85, 70, 75], "image": "images/nino.webp", "quote": "别以为每个女人都会对你笑就是喜欢你。", "cv": "佐仓绫音", "birthday": "5月5日", "catchphrase": "哈？你在烦我。", "color": "#000080", "favor_quote": "我讨厌你的理由已经没有了……也就是说，你可以继续待在我身边。这算是一种……许可吧。"}, {"id": "chizuru", "name": "水原千鹤", "series": "租借女友", "tags": "演员,完美,黑发", "description": "水原千鹤是大学文学部学生，兼职做租借女友。她将演技和真心完美区分——在工作时是完美的理想女友，私底下却是个认真固执、不善表达感情的女孩。她对演艺事业有着炽热的追求，继承了已故祖父的演员梦想。她与木之下和也的关系在'租借'与'真心'之间反复拉扯，每一次接近都伴随着自我怀疑和退缩。她的矜持不是傲娇，而是害怕跨越界限后失去一切。", "appearance": "棕色短发，棕色眼眸，穿时尚服装", "traits": [80, 70, 85, 50, 85, 45, 85, 82, 50, 70, 65, 65], "image": "images/chizuru.jpg", "quote": "这是工作……至少，应该是的。", "cv": "雨宫天", "birthday": "4月19日", "catchphrase": "（整理头发）那么，今天也请多关照了。", "color": "#00bfff", "favor_quote": "虽然一开始只是工作……但现在，你的笑容对我来说已经很重要了。这大概……不算职业范畴了吧。"}, {"id": "ai", "name": "星野爱", "series": "我推的孩子", "tags": "偶像,星星眼,谎言", "description": "星野爱是国民级偶像团体的C位，拥有星星般闪耀的眼睛。她从小不知道什么是'爱'，因此用谎言来填充自己缺失的感情——对粉丝说'我爱你'时并不理解这句话的重量。她将两个孩子藏起来独自抚养，试图在偶像和母亲之间找到平衡。她的成长之路是从'不懂爱'到'想要学会爱'的旅程。她的悲剧在于，当她终于开始理解什么是爱的那一刻，一切戛然而止。", "appearance": "紫粉色长发，紫红异色星形瞳，穿偶像服装", "traits": [75, 90, 65, 75, 70, 45, 85, 60, 70, 85, 80, 80], "image": "images/ai.jpg", "quote": "撒谎是最棒的——因为撒谎就是爱。", "cv": "高桥李依", "birthday": "11月25日", "catchphrase": "（wink）我推的孩子~♪", "color": "#ff1493", "favor_quote": "你是第一个让我觉得'也许不需要撒谎也可以'的人。所以……这份心情，也许是真的？"}, {"id": "yor", "name": "约尔·福杰", "series": "间谍过家家", "tags": "杀手,刺客,温柔", "description": "约尔·福杰是贝尔林市的普通市政厅职员——至少表面如此。实际上她是代号'荆棘公主'的顶尖刺客。她为了掩饰身份与间谍洛伊德假结婚，组成了一个充满谎言却真挚的家庭。她不擅长家务和做饭（料理堪比毒药），但在战斗中无人能敌。她对阿尼亚的母爱是真实的，对这个假家庭的珍惜也是真实的。她的故事是关于'即使建立在谎言上的关系也能孕育真实的感情'。", "appearance": "黑色长发，金色眼眸，穿红色刺客服或日常裙装", "traits": [75, 80, 85, 55, 90, 40, 80, 78, 65, 60, 70, 55], "image": "images/yor.jpg", "quote": "啊啦~我作为母亲的职责，就是要保护这个家呢。", "cv": "早见沙织", "birthday": "9月20日", "catchphrase": "（微笑）我会加油的！", "color": "#9370db", "favor_quote": "虽然我不是很擅长这些……但为了你和阿尼亚，我愿意学会做任何事。因为你们是我的家人。"}, {"id": "nezuko", "name": "灶门祢豆子", "series": "鬼灭之刃", "tags": "鬼,竹筒,妹", "description": "灶门祢豆子是炭治郎的妹妹，被鬼舞辻无惨变成了鬼却保留了人性。她咬着竹筒沉默不语，用行动代替言语。即便变成了鬼，她依然守护着人类——尤其是自己的家人。她能在白天活动（与普通鬼不同），体型可以自由变化。她的温柔没有因变成鬼而消失，反而更加纯粹。她与炭治郎之间的兄妹情是整部作品的核心——那份'即使你不再是人，我也要守护你'的誓言。", "appearance": "黑色长发末端渐变橙色，粉色眼眸，嘴里咬着竹筒，穿和服", "traits": [85, 75, 60, 65, 95, 30, 70, 50, 60, 50, 80, 45], "image": "images/nezuko.jpg", "quote": "唔——！（拍胸脯）", "cv": "鬼头明里", "birthday": "12月28日", "catchphrase": "唔——！（咬竹筒）", "color": "#ff1493", "favor_quote": "唔唔——！（紧紧抱住你，不想松手）嗯……唔。（意思是：不想分开）"}, {"id": "asuna", "name": "结城明日奈", "series": "刀剑神域", "tags": "闪光,细剑,料理", "description": "结城明日奈是SAO中的'闪光'，拥有极快剑技的顶级玩家。她在现实中是大企业的千金小姐，被期望成为完美的继承人。在SAO中她找到了真正的自我——不是家族的附庸，而是一个能为爱奋不顾身的战士。她与桐人的爱情是虚拟世界中最真实的感情。她从'等待被拯救的公主'成长为'并肩作战的战友'，这份独立和坚韧是她最闪耀的地方。她的爱是确定的、坚定的、永不退缩的。", "appearance": "橙棕色长发，蓝灰色眼眸，穿红白骑士装持细剑", "traits": [85, 85, 80, 60, 90, 55, 85, 80, 45, 80, 75, 70], "image": "images/asuna.jpg", "quote": "哪怕是虚拟世界，我的心是真实的。", "cv": "户松遥", "birthday": "9月30日", "catchphrase": "（举剑）我来掩护你！", "color": "#ff69b4", "favor_quote": "无论在哪个世界，只要有你在，我就能继续前进。所以……这次换我来保护你。"}, {"id": "ayu", "name": "月宫亚由", "series": "Kanon", "tags": "鲷鱼烧,元气,约定", "description": "月宫亚由是北国小镇上与祐一相遇的神秘少女，总是背着带有天使翅膀的书包。她喜欢吃鲷鱼烧，口头禅是'呜咕'。她的笑容能融化冬日的寒冰，但她的存在本身就是一个奇迹——一个跨越了七年的约定。她在等待一个承诺回来的人，即便自己已不再是原来的形态。她的故事是关于'等待'和'奇迹'最温暖的诠释——只要不放弃，愿望就一定能实现。", "appearance": "红棕色短发，戴红色发箍，穿校服和围巾", "traits": [90, 90, 50, 85, 85, 35, 60, 55, 45, 80, 85, 75], "image": "images/ayu.jpg", "quote": "这是……约定的场所！一定能等到你的！", "cv": "堀江由衣", "birthday": "1月7日", "catchphrase": "呜咕……鲷鱼烧好好吃！", "color": "#ff6347", "favor_quote": "无论过了多少年，我都会在这里等你。因为……这是我们约定好的地方啊！"}, {"id": "nayuki", "name": "水濑名雪", "series": "Kanon", "tags": "草莓,睡虫,表妹", "description": "水濑名雪是祐一的表妹，北国学校的田径部部长。她有着严重的低血压和起床困难症，早上总是一副迷糊的样子。她喜欢草莓和猫咪，说话总是慢悠悠的。她对祐一的感情是从小培养的，却因为七年前的事故而变得复杂。她的温柔如同北国的雪——安静、纯洁、持久。她的成长是从'不敢面对'到'愿意说出真心话'的旅程。她的笑容是冬日里最温暖的阳光。", "appearance": "蓝色短发，戴蓝色发箍，穿校服", "traits": [85, 65, 60, 60, 85, 30, 65, 60, 35, 55, 75, 60], "image": "images/nayuki.jpg", "quote": "早上好……再让我睡五分钟……不，十分钟……", "cv": "国府田麻理子", "birthday": "12月23日", "catchphrase": "（打哈欠）嗯……再五分钟……", "color": "#00bfff", "favor_quote": "虽然我总是睡不醒……但只要和你在一起，就一定能早起。所以……叫我起床吧？"}, {"id": "shiori", "name": "仓田汐里", "series": "Kanon", "tags": "体弱,等待,雪", "description": "仓田汐里是祐一在学校庭院遇到的安静少女，总是独自一人站在雪中。她身体虚弱，经常缺课，却总是面带微笑。她看似平静，内心却在与时间和命运赛跑。她对祐一的感情是安静而坚定的——不需要轰轰烈烈，只要能在一起就足够了。她的故事是关于'珍惜当下'最温柔的提醒——因为不知道哪一次见面会是最后一次。她的微笑是雪中最美的风景。", "appearance": "棕色短发，戴白色帽子，穿校服和围巾", "traits": [90, 40, 55, 45, 80, 35, 70, 65, 55, 40, 80, 40], "image": "images/shiori.jpg", "quote": "我一直在等一个人……能和我一起看雪的人。", "cv": "小林沙苗", "birthday": "2月18日", "catchphrase": "（轻声）那个……可以吗？", "color": "#87ceeb", "favor_quote": "虽然我身体不好……但只要和你在一起，就觉得自己什么都能做到。所以……请不要丢下我。"}, {"id": "makoto", "name": "美坂香里", "series": "Kanon", "tags": "野性,记忆,狐", "description": "美坂香里是名雪的挚友和同班同学，表面上是成熟稳重的优等生。她做事冷静理性，说话一针见血，但对待朋友有着不外露的温柔。她对祐一的感情发展是从互相吐槽到互相依赖的过程。她有着不为人知的家庭烦恼，但从不向他人倾诉。她的成长是从'独自承担一切'到'愿意依赖他人'的转变。她的成熟是保护色，里面是一个渴望被关心的普通女孩。", "appearance": "橙色短发，戴猫耳帽，穿休闲装", "traits": [70, 85, 50, 80, 70, 45, 50, 40, 60, 70, 75, 65], "image": "images/makoto.jpg", "quote": "其实我啊……一直有个想实现的愿望。", "cv": "小林沙苗", "birthday": "10月13日", "catchphrase": "（叉腰）哼，才不是在意你呢！", "color": "#ffa500", "favor_quote": "虽然我总是嘴硬……但其实和你在一起的时候最开心了。所以……以后也陪着我好不好？"}, {"id": "megumi", "name": "加藤惠", "series": "路人女主的养成方法", "tags": "路人,帽子,游戏", "description": "加藤惠是安艺伦也的同班同学，被选为同人游戏的'第一女主角'。她是'不起眼'的代名词——存在感低到站在身边都注意不到。但正是这种平凡反而成为了最大的魅力。她不傲娇、不天然、不病弱、不可爱到爆炸——她就是一个普通的女孩子。她的成长是从'被忽视的背景板'到'不可替代的存在'的旅程。她的温柔是那种润物细无声的，等你发现时已经离不开了。", "appearance": "棕色短发，戴贝雷帽，穿校服", "traits": [70, 55, 80, 50, 80, 30, 65, 72, 45, 55, 60, 55], "image": "images/megumi.jpg", "quote": "嗯……那个，我是不是被忘记了？", "cv": "安野希世乃", "birthday": "9月19日", "catchphrase": "（面无表情）啊……是吗。", "color": "#ff69b4", "favor_quote": "虽然我可能不够特别……但我会一直在你身边的。这就是我能做到的事。"}, {"id": "eriri", "name": "泽村·斯潘塞·英梨梨", "series": "路人女主的养成方法", "tags": "金发,画师,傲娇", "description": "泽村·斯潘塞·英梨梨是伦也的青梅竹马，隐藏身份是同人界的超人气画师'柏木英理'。她金发双马尾，在学校是高傲的大小姐，在画室里却是不眠不休的创作者。她对伦也的感情是从小积累的，却用傲娇来掩饰。她的创作之路充满了自我怀疑和压力——天才的骄傲与现实的落差让她备受煎熬。她的故事是关于'在热爱与自我之间找到平衡'的奋斗。", "appearance": "金色双马尾，蓝色眼眸，穿校服或画师装", "traits": [65, 75, 75, 60, 75, 90, 80, 65, 40, 70, 70, 60], "image": "images/eriri.jpg", "quote": "才、才不是为了你才画的！只是恰好……灵感来了而已！", "cv": "大西沙织", "birthday": "3月20日", "catchphrase": "哼！别搞错了！", "color": "#ffd700", "favor_quote": "我的画……都是因为有你才画得出来的。所以不要否定自己，因为你是我最重要的灵感。"}, {"id": "utaha", "name": "霞之丘诗羽", "series": "路人女主的养成方法", "tags": "黑丝,编剧,毒舌", "description": "霞之丘诗羽是丰之崎学校的三年级学生，超人气轻小说作家。她黑发长腿、气质成熟，说话总是带着戏谑和挑逗。她用毒舌和暧昧来与人保持既亲近又疏离的距离。她对伦也的才华有着认可，但同时也因为他的优柔寡断而感到失望。她的感情是复杂的——既是师徒间的欣赏，也是男女间的暧昧，更是一种对'被理解'的渴望。她是那种越了解越着迷的类型。", "appearance": "黑色长发，穿黑色过膝袜和校服", "traits": [70, 55, 90, 50, 70, 65, 90, 88, 70, 65, 65, 50], "image": "images/utaha.jpg", "quote": "学长真是……可爱的孩子呢。让我再多欺负一下？", "cv": "矢作纱友里", "birthday": "12月5日", "catchphrase": "呵呵~学长今天也很可爱呢。", "color": "#9370db", "favor_quote": "虽然我喜欢捉弄你……但你是我认可的唯一的人。所以不要让我失望，好吗？学长。"}, {"id": "nao", "name": "友利奈绪", "series": "Charlotte", "tags": "摄像机,面包,坚强", "description": "友利奈绪是星之海学园学生会会长，拥有'只对一人不可见'的特殊能力。她性格冷静理性，做事果决不拖泥带水。她总是拿着摄像机记录一切，这是她保护自己的方式。她的哥哥因能力被滥用而精神崩溃，这让她对成年人和权威充满了不信任。她的成长是从'不再相信任何人'到'愿意把后背交给伙伴'的转变。她的冷面下藏着一颗比谁都渴望温暖的心。", "appearance": "银白色短发，穿校服，手持摄像机", "traits": [70, 80, 85, 55, 85, 60, 75, 78, 55, 85, 65, 60], "image": "images/nao.jpg", "quote": "我已经不相信任何人了——除了你。", "cv": "内田真礼", "birthday": "不明", "catchphrase": "（举摄像机）——录制开始。", "color": "#c0c0c0", "favor_quote": "你是唯一不会背叛我的人。所以……一直留在我身边吧。这不是请求，是命令。"}, {"id": "shouko", "name": "西宫硝子", "series": "声之形", "tags": "听障,温柔,坚强", "description": "西宫硝子是听力障碍少女，小学时因转学而遭受了严重的校园霸凌。她总是面带微笑，用温柔对待恶意，但这不是因为软弱——而是她选择了不被黑暗吞噬。她用手语和笔记交流，努力融入一个不接纳她的世界。她的自卑和自责让她多次想要放弃，但石田将也的出现让她看到了被理解的可能。她的故事是关于'被听见'——不是声音，而是心的声音。", "appearance": "粉色短发，戴助听器，穿校服", "traits": [95, 45, 55, 40, 85, 20, 65, 65, 40, 40, 85, 45], "image": "images/shouko.jpg", "quote": "我……一直在努力。但是……有时候真的很辛苦。", "cv": "早见沙织", "birthday": "6月7日", "catchphrase": "（手语）谢谢你……", "color": "#ff69b4", "favor_quote": "（手语）即使我听不见你的声音，但我能感受到你的心意。所以……请不要逃避。"}, {"id": "kirino", "name": "高坂桐乃", "series": "俺妹", "tags": "模特,宅,金牌", "description": "高坂桐乃是中学生模特兼优等生，表面上是完美的现充美少女，暗地里却是宅文化的狂热爱好者。她对哥哥京介的感情是矛盾的——嘴上说着'变态哥哥'，实际上依赖他到无可救药。她的傲娇是全方位的——对人冷淡、对哥哥毒舌、对喜欢的事物却无比狂热。她的成长是学会面对真实的自己，不再用'现充'面具来逃避。她的'讨厌'是最拙劣的'喜欢'，她的'不需要'是最直白的'离不开'。", "appearance": "棕色长发，蓝色眼眸，穿时尚服装", "traits": [60, 90, 80, 65, 70, 85, 75, 65, 40, 85, 70, 75], "image": "images/kirino.jpg", "quote": "哼！别以为我会感谢你！", "cv": "竹达彩奈", "birthday": "4月8日", "catchphrase": "——哈？你在说什么啊！", "color": "#ff4500", "favor_quote": "虽然我嘴上不说……但你是我最可靠的哥哥。所以……不要擅自离开我，笨蛋！"}, {"id": "kuroneko", "name": "五更琉璃（黑猫）", "series": "俺妹", "tags": "哥特,中二,黑猫", "description": "五更琉璃（黑猫）是桐乃的宅友，自称'暗夜魔女'的中二病少女。她黑发蕾丝发带，说话总是带着中二气息，自称'吾'或'本宫'。她表面上看不起凡人，实际上内心细腻敏感。她与京介的恋爱是她第一次尝试走出自己的壳。她对创作的执着、对朋友的忠诚、对感情的笨拙构成了她独特的魅力。她的中二病不是逃避，而是她理解世界的方式——用黑暗来包裹一颗比谁都柔软的心。", "appearance": "黑色长发，蓝色眼眸，穿哥特萝莉装", "traits": [65, 50, 85, 60, 80, 75, 85, 70, 75, 50, 60, 40], "image": "images/kuroneko.jpg", "quote": "凡人的智慧果然无法理解黑暗的深渊呢。", "cv": "花泽香菜", "birthday": "12月21日", "catchphrase": "（翻书）……凡人。", "color": "#4b0082", "favor_quote": "虽然你是令人遗憾的人类……但在你身边时，黑暗似乎不那么孤独了。所以……就允许你多待一会儿吧。"}, {"id": "manami", "name": "田村麻奈实", "series": "俺妹", "tags": "眼镜,青梅,温柔", "description": "田村麻奈实是京介的青梅竹马，温柔朴实如同邻家大姐姐。她不惊艳、不张扬，总是安安静静地等待。她的温柔是细水长流式的——一杯茶、一句问候、一个微笑。她看似什么都在意，实际上对京介的感情深埋心底。她的存在像空气一样自然，以至于被忽视时才意识到她的重要。她的故事是关于'一直都在的人'最平凡也最动人的叙事。", "appearance": "棕色短发，戴圆框眼镜，穿朴素服装", "traits": [90, 50, 65, 40, 85, 15, 55, 72, 30, 45, 75, 60], "image": "images/manami.jpg", "quote": avgTraits.forEach(function(t){bh+='<div class="bar-row"><div class="bar-label">'+t.label+'</div><div class="bar-track"><div class="bar-fill" style="width:'+t.avg+'%;background:'+t.color+'"><span class="bar-val">'+t.avg+'</span></div></div></div>'});
document.getElementById('avgBarChart').innerHTML=bh;
var seriesCount={};CH.forEach(function(c){seriesCount[c.series]=(seriesCount[c.series]||0)+1});
var seriesArr=Object.keys(seriesCount).map(function(k){return{name:k,count:seriesCount[k]}}).sort(function(a,b){return b.count-a.count});
var sh='';seriesArr.forEach(function(s){sh+='<div class="bar-row"><div class="bar-label" style="width:120px;font-size:12px">'+s.name+'</div><div class="bar-track"><div class="bar-fill" style="width:'+(s.count/seriesArr[0].count*100)+'%;background:linear-gradient(90deg,var(--pink),var(--purple))"><span class="bar-val">'+s.count+'</span></div></div></div>'});
document.getElementById('seriesChart').innerHTML=sh}
function showDetail(id){
var c=CH.find(function(x){return x.id===id});if(!c)return;
viewStats[id]=(viewStats[id]||0)+1;try{localStorage.setItem('waifuViewStats',JSON.stringify(viewStats))}catch(e){}
var tags=c.tags.split(',');
var h='<div class="modal-image-wrap"><img src="'+c.image+'" alt="'+c.name+'" onerror="this.style.display=\'none\'" loading="lazy"></div><div class="modal-body">';
h+='<div style="font-size:13px;color:var(--accent);margin-bottom:4px">'+c.series+'</div><h2 style="font-size:24px;margin-bottom:8px">'+c.name+'</h2>';
h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">';tags.forEach(function(t){h+='<span class="result-tag">'+t+'</span>'});h+='</div>';
h+='<div class="result-meta"><div class="result-meta-item"><div class="result-meta-label">声优</div><div class="result-meta-val" style="font-size:13px">'+c.cv+'</div></div><div class="result-meta-item"><div class="result-meta-label">生日</div><div class="result-meta-val" style="font-size:13px">'+c.birthday+'</div></div><div class="result-meta-item"><div class="result-meta-label">口癖</div><div class="result-meta-val" style="font-size:11px">'+c.catchphrase+'</div></div></div>';
h+='<p style="color:var(--dim);font-size:14px;line-height:1.8;margin-bottom:12px">'+c.appearance+'</p>';
h+='<div class="result-quote" style="margin-bottom:12px">「'+c.quote+'」</div>';
h+='<p style="font-size:14px;line-height:1.8">'+c.description+'</p>';
h+='<div class="result-favor-quote" style="margin-top:16px"><div class="heart">💗</div><p style="font-size:14px">'+c.favor_quote+'</p><div class="attr">——'+c.name+'</div></div>';
h+='<h3 style="font-size:14px;margin:16px 0 8px;color:var(--accent)">性格维度</h3><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">';
DM.forEach(function(d,i){var v=c.traits[i];h+='<div style="text-align:center"><div style="font-size:12px;color:var(--dim)">'+d.label+'</div><div style="font-size:18px;font-weight:700;color:'+(v>70?'var(--accent)':v>40?'var(--text)':'var(--dim)')+'">'+v+'</div></div>'});
h+='</div></div>';
document.getElementById('modalContent').innerHTML=h;
document.getElementById('modal').classList.add('active')}
function closeModal(e){if(e&&e.target!==document.getElementById('modal'))return;document.getElementById('modal').classList.remove('active')}
goHome();
</script>
